name: Portfolio CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-merge-gate-lab:
    name: Validate merge-gate lab
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified SHA)
        with:
          fetch-depth: 0 # Gitleaks requires commit history for its PR diff range

      - name: Scan repository for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3, pinned commit
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (verified SHA)
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: python3 -m compileall -q labs

      - name: Check Markdown links
        run: python3 scripts/check_portfolio_links.py

      - name: Run regression tests
        working-directory: labs/04-devsecops-merge-gate
        run: python3 -m unittest -v test_gate.py

      - name: Reproduce decision matrix
        working-directory: labs/04-devsecops-merge-gate
        shell: bash
        run: |
          set -euo pipefail

          python3 gate.py evidence/positive.json
          if python3 gate.py evidence/negative.json; then
            echo "negative.json unexpectedly passed"
            exit 1
          fi

          python3 gate.py evidence/not-applicable.json
          if python3 gate.py evidence/unknown.json; then
            echo "unknown.json unexpectedly passed"
            exit 1
          fi

  validate-cloud-security-labs:
    name: Validate synthetic cloud-security labs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified SHA)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (verified SHA)
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python3 -m compileall -q labs
      - name: Incident triage regression tests
        run: python3 -m unittest discover -s labs/01-cloud-incident-triage -p 'test_*.py' -v
      - name: Validate synthetic private serverless boundary
        run: python3 -m unittest discover -s labs/02-cloud-least-privilege -p 'test_review_serverless.py' -v
      - name: Least privilege regression tests
        run: python3 -m unittest discover -s labs/02-cloud-least-privilege -p 'test_*.py' -v
      - name: Smoke test local analyzers
        run: |
          set -euo pipefail
          python3 labs/01-cloud-incident-triage/triage.py > /dev/null
          python3 labs/02-cloud-least-privilege/review_access.py > /dev/null
  validate-ai-action-boundary:
    name: Validate AI action-boundary lab
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python3 -m compileall -q labs/03-ai-tool-authorization

      - name: Run authorization regression tests
        run: python3 -m unittest discover -s labs/03-ai-tool-authorization -p 'test_*.py' -v

      - name: Run adversarial security tests
        shell: bash
        run: |
          set -euo pipefail
          python3 labs/03-ai-tool-authorization/review/adversarial_round1.py labs/03-ai-tool-authorization
          python3 labs/03-ai-tool-authorization/review/adversarial_round2.py labs/03-ai-tool-authorization

      - name: Verify all security scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 labs/03-ai-tool-authorization/demo.py --scenario ALL > /tmp/ai-action-all.json
          python3 - <<'PY'
          import json

          with open("/tmp/ai-action-all.json", encoding="utf-8") as f:
              data = json.load(f)

          expected = {
              "C01": 1, "C02": 0, "C03": 0, "C04": 0,
              "C05": 0, "C06": 1, "C07": 0, "CONCURRENT": 1,
          }

          assert data["overall_verdict"] == "PASS"
          assert len(data["results"]) == len(expected)
          assert {r["scenario"] for r in data["results"]} == set(expected)

          for result in data["results"]:
              name = result["scenario"]
              assert name in expected
              assert result["verdict"] == "PASS"
              assert result["total_mutations"] == expected[name]
              print(f"{name}: PASS")

          print("ALL SECURITY SCENARIOS: PASS")
          PY
